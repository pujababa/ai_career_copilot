{% extends "base.html" %}

{% block content %}
<div class="cards-grid">
  <article class="card wide">
    <div class="card-header">
      <h2><i class="fa-solid fa-bell" style="color: var(--accent); margin-right: 8px;"></i> Notification & Alert Center</h2>
      <span class="badge badge-soft">Updates</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px;">
      {% for n in notifications %}
      <div class="glass-card" style="padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div style="width: 40px; height: 40px; border-radius: 999px; background: rgba(99, 102, 241, 0.15); display: flex; align-items: center; justify-content: center; color: var(--accent-strong);">
            <i class="fa-solid fa-bell"></i>
          </div>
          <div>
            <h4 style="margin: 0; font-size: 1rem; color: var(--text-strong);">{{ n.title }}</h4>
            <p style="margin: 4px 0 0; font-size: 0.85rem; color: var(--text-muted);">{{ n.message }}</p>
          </div>
        </div>
        <span style="font-size: 0.8rem; color: var(--text-soft);">{{ n.created_at }}</span>
      </div>
      {% endfor %}
    </div>
  </article>
</div>
{% endblock %}
